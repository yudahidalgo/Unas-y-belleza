<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uñas y Belleza</title>

    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: #333;

            /*
             * FOTO DE FONDO
             *
             * Archivo:
             * images/images.jpg
             */

            background-color: #f8dfe9;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.08)
                ),
                url("./images/images.jpg");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
        ===================================================== */

        .contenedor {
            width: 94%;

            max-width: 1050px;

            margin: 25px auto;

            padding: 25px;

            /*
             * MUY TRANSPARENTE
             */

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.35);

            border-radius: 24px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.15);

            /*
             * Efecto de cristal
             */

            backdrop-filter: blur(2px);

            -webkit-backdrop-filter: blur(2px);
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        header {
            text-align: center;

            margin-bottom: 25px;

            padding: 10px;
        }

        header h1 {
            color: #b51f67;

            font-size: 36px;

            margin-bottom: 8px;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.8);
        }

        header p {
            color: #4d4d4d;

            font-size: 16px;

            font-weight: 600;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.8);
        }


        /* =====================================================
           CABECERA DEL CALENDARIO
        ===================================================== */

        .cabecera-calendario {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 15px;

            padding: 5px;
        }

        .cabecera-calendario h2 {
            flex: 1;

            text-align: center;

            color: #a91e61;

            font-size: 25px;

            text-transform: capitalize;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.9);
        }


        /* =====================================================
           BOTONES CAMBIAR MES
        ===================================================== */

        .boton-mes {
            width: 44px;

            height: 44px;

            border: 1px solid rgba(255, 255, 255, 0.5);

            border-radius: 50%;

            background: rgba(214, 51, 132, 0.82);

            color: white;

            font-size: 26px;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .boton-mes:hover:not(:disabled) {
            background: rgba(184, 37, 109, 0.95);

            transform: scale(1.05);
        }

        .boton-mes:disabled {
            background: rgba(130, 130, 130, 0.45);

            cursor: not-allowed;
        }


        /* =====================================================
           DÍAS DE LA SEMANA
        ===================================================== */

        .dias-semana {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 7px;

            margin-bottom: 7px;
        }

        .nombre-dia {
            text-align: center;

            padding: 10px 3px;

            color: #8f1551;

            font-weight: bold;

            font-size: 14px;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.9);
        }


        /* =====================================================
           CALENDARIO
        ===================================================== */

        .calendario {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 7px;
        }


        /* =====================================================
           DÍAS DEL CALENDARIO
        ===================================================== */

        .dia {
            min-height: 78px;

            border: 1px solid rgba(255, 255, 255, 0.45);

            border-radius: 13px;

            padding: 7px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s,
                box-shadow 0.15s;

            position: relative;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.08);
        }


        .dia:hover:not(:disabled):not(.vacio) {
            transform: translateY(-2px);

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.18);
        }


        /* =====================================================
           DÍAS VACÍOS
        ===================================================== */

        .dia.vacio {
            background: transparent;

            border: none;

            box-shadow: none;

            pointer-events: none;
        }


        /* =====================================================
           VERDE
           2 HORARIOS DISPONIBLES
        ===================================================== */

        .dia.disponible {
            background: rgba(116, 220, 139, 0.68);

            color: #145d27;
        }


        /* =====================================================
           AMARILLO
           1 HORARIO DISPONIBLE
        ===================================================== */

        .dia.parcial {
            background: rgba(255, 218, 76, 0.72);

            color: #6b5100;
        }


        /* =====================================================
           ROJO
           COMPLETO
        ===================================================== */

        .dia.completo {
            background: rgba(239, 102, 102, 0.72);

            color: #851818;

            cursor: not-allowed;
        }


        /* =====================================================
           GRIS
           PASADO
        ===================================================== */

        .dia.pasado {
            background: rgba(180, 180, 180, 0.62);

            color: #666;

            cursor: not-allowed;
        }


        /* =====================================================
           DÍA SELECCIONADO
        ===================================================== */

        .dia.seleccionado {
            outline: 3px solid #d63384;

            outline-offset: 2px;

            box-shadow:
                0 0 12px rgba(214, 51, 132, 0.5);
        }


        /* =====================================================
           NÚMERO
        ===================================================== */

        .numero-dia {
            font-size: 19px;

            margin-bottom: 5px;
        }


        /* =====================================================
           ESTADO
        ===================================================== */

        .estado-dia {
            font-size: 10px;

            font-weight: bold;

            text-align: center;
        }


        /* =====================================================
           LEYENDA
        ===================================================== */

        .leyenda {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 14px;

            margin-top: 20px;

            margin-bottom: 25px;

            padding: 10px;
        }

        .leyenda-item {
            display: flex;

            align-items: center;

            gap: 6px;

            color: #444;

            font-size: 13px;

            font-weight: 600;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .cuadro-leyenda {
            width: 18px;

            height: 18px;

            border-radius: 5px;

            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .verde {
            background: rgba(116, 220, 139, 0.68);
        }

        .amarillo {
            background: rgba(255, 218, 76, 0.72);
        }

        .rojo {
            background: rgba(239, 102, 102, 0.72);
        }

        .gris {
            background: rgba(180, 180, 180, 0.62);
        }


        /* =====================================================
           SECCIÓN RESERVA
        ===================================================== */

        .reserva {
            border-top:
                1px solid rgba(255, 255, 255, 0.5);

            padding-top: 25px;
        }

        .reserva h2 {
            text-align: center;

            color: #a91e61;

            font-size: 25px;

            margin-bottom: 8px;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.9);
        }


        /* =====================================================
           FECHA SELECCIONADA
        ===================================================== */

        .fecha-seleccionada {
            min-height: 22px;

            margin-bottom: 20px;

            text-align: center;

            color: #444;

            font-size: 15px;

            font-weight: bold;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.9);
        }


        /* =====================================================
           HORARIOS
        ===================================================== */

        .horarios {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }

        .boton-hora {
            padding: 14px;

            border: 2px solid
                rgba(214, 51, 132, 0.8);

            border-radius: 12px;

            /*
             * TRANSPARENTE
             */

            background:
                rgba(255, 255, 255, 0.42);

            color: #a91e61;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.08);
        }

        .boton-hora:hover:not(:disabled) {
            background:
                rgba(255, 255, 255, 0.65);
        }

        .boton-hora.seleccionado {
            background:
                rgba(214, 51, 132, 0.85);

            color: white;
        }

        .boton-hora.ocupado {
            background:
                rgba(190, 190, 190, 0.55);

            border-color:
                rgba(120, 120, 120, 0.6);

            color: #777;

            text-decoration: line-through;

            cursor: not-allowed;
        }

        .boton-hora:disabled {
            cursor: not-allowed;
        }


        /* =====================================================
           FORMULARIO
        ===================================================== */

        .formulario {
            display: grid;

            gap: 10px;
        }

        .formulario label {
            color: #444;

            font-weight: bold;

            text-shadow:
                0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .formulario input {
            width: 100%;

            padding: 13px;

            border:
                1px solid rgba(255, 255, 255, 0.65);

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            /*
             * TRANSPARENTE
             */

            background:
                rgba(255, 255, 255, 0.45);

            color: #333;

            box-shadow:
                inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        .formulario input::placeholder {
            color: #666;
        }

        .formulario input:focus {
            border-color:
                rgba(214, 51, 132, 0.8);

            background:
                rgba(255, 255, 255, 0.62);

            box-shadow:
                0 0 0 2px
                rgba(214, 51, 132, 0.12);
        }


        /* =====================================================
           BOTÓN RESERVAR
        ===================================================== */

        .boton-reservar {
            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                rgba(214, 51, 132, 0.86);

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .boton-reservar:hover:not(:disabled) {
            background:
                rgba(184, 37, 109, 0.95);

            transform: translateY(-1px);
        }

        .boton-reservar:disabled {
            background:
                rgba(140, 140, 140, 0.65);

            cursor: not-allowed;
        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        .mensaje {
            display: none;

            margin-top: 15px;

            padding: 13px;

            border-radius: 10px;

            text-align: center;

            font-weight: bold;
        }

        .mensaje.exito {
            display: block;

            background:
                rgba(212, 237, 218, 0.82);

            color: #155724;
        }

        .mensaje.error {
            display: block;

            background:
                rgba(248, 215, 218, 0.85);

            color: #721c24;
        }


        /* =====================================================
           MÓVIL
        ===================================================== */

        @media (max-width: 600px) {

            body {
                background-attachment: scroll;
            }

            .contenedor {
                width: 97%;

                margin: 10px auto;

                padding: 13px;

                border-radius: 17px;

                background:
                    rgba(255, 255, 255, 0.10);
            }

            header h1 {
                font-size: 28px;
            }

            header p {
                font-size: 13px;
            }

            .cabecera-calendario h2 {
                font-size: 20px;
            }

            .boton-mes {
                width: 38px;

                height: 38px;

                font-size: 22px;
            }

            .dias-semana,
            .calendario {
                gap: 4px;
            }

            .nombre-dia {
                padding: 7px 1px;

                font-size: 10px;
            }

            .dia {
                min-height: 63px;

                padding: 4px;

                border-radius: 8px;
            }

            .numero-dia {
                font-size: 16px;

                margin-bottom: 3px;
            }

            .estado-dia {
                font-size: 8px;
            }

            .horarios {
                grid-template-columns: 1fr;

                gap: 10px;
            }

            .leyenda {
                gap: 7px;

                padding: 5px;
            }

            .leyenda-item {
                font-size: 9px;
            }

            .cuadro-leyenda {
                width: 14px;

                height: 14px;
            }

        }

    </style>
</head>


<body>

    <div class="contenedor">


        <!-- =================================================
             ENCABEZADO
        ================================================== -->

        <header>

            <h1>
                💅 Uñas y Belleza
            </h1>

            <p>
                Reserva tu cita de manera fácil y rápida
            </p>

        </header>


        <!-- =================================================
             CALENDARIO
        ================================================== -->

        <section class="calendario-contenedor">


            <div class="cabecera-calendario">

                <button
                    type="button"
                    class="boton-mes"
                    id="mesAnterior"
                    onclick="cambiarMes(-1)"
                    aria-label="Mes anterior"
                >
                    ‹
                </button>


                <h2 id="mesActual"></h2>


                <button
                    type="button"
                    class="boton-mes"
                    onclick="cambiarMes(1)"
                    aria-label="Mes siguiente"
                >
                    ›
                </button>

            </div>


            <!-- DÍAS -->

            <div class="dias-semana">

                <div class="nombre-dia">
                    LUN
                </div>

                <div class="nombre-dia">
                    MAR
                </div>

                <div class="nombre-dia">
                    MIÉ
                </div>

                <div class="nombre-dia">
                    JUE
                </div>

                <div class="nombre-dia">
                    VIE
                </div>

            </div>


            <!-- CALENDARIO -->

            <div
                id="calendario"
                class="calendario"
            ></div>


            <!-- LEYENDA -->

            <div class="leyenda">

                <div class="leyenda-item">

                    <span
                        class="cuadro-leyenda verde"
                    ></span>

                    Disponible

                </div>


                <div class="leyenda-item">

                    <span
                        class="cuadro-leyenda amarillo"
                    ></span>

                    1 disponible

                </div>


                <div class="leyenda-item">

                    <span
                        class="cuadro-leyenda rojo"
                    ></span>

                    Completo

                </div>


                <div class="leyenda-item">

                    <span
                        class="cuadro-leyenda gris"
                    ></span>

                    No disponible

                </div>

            </div>

        </section>


        <!-- =================================================
             RESERVA
        ================================================== -->

        <section class="reserva">

            <h2>
                📅 Reservar cita
            </h2>


            <div
                id="fechaSeleccionada"
                class="fecha-seleccionada"
            >
                Selecciona un día en el calendario
            </div>


            <!-- HORARIOS -->

            <div class="horarios">

                <button
                    type="button"
                    class="boton-hora"
                    id="hora10"
                    onclick="seleccionarHora('10:00')"
                    disabled
                >
                    🕙 10:00 AM
                </button>


                <button
                    type="button"
                    class="boton-hora"
                    id="hora14"
                    onclick="seleccionarHora('14:00')"
                    disabled
                >
                    🕑 2:00 PM
                </button>

            </div>


            <!-- FORMULARIO -->

            <form
                id="formularioReserva"
                class="formulario"
                onsubmit="reservar(event)"
            >

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    autocomplete="name"
                    required
                >


                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="Ejemplo: 5355555555"
                    autocomplete="tel"
                    required
                >


                <button
                    type="submit"
                    class="boton-reservar"
                    id="botonReservar"
                >
                    Confirmar reserva
                </button>

            </form>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="mensaje"
            ></div>

        </section>

    </div>


    <script>

        /* =====================================================
           CONFIGURACIÓN
        ===================================================== */

        const URL_GOOGLE_SHEETS =
            "https://script.google.com/macros/s/AKfycbxXoH-FR1RlTAnfQFw6StDxPRQb814L2UDI5VF8GhEzE71MHvhrb8-S14USDSjjbRk/exec";


        const NUMERO_WHATSAPP =
            "5354019544";


        const HORAS = [
            "10:00",
            "14:00"
        ];


        /* =====================================================
           VARIABLES
        ===================================================== */

        let fechaCalendario =
            new Date();

        let fechaSeleccionada =
            null;

        let horaSeleccionada =
            null;

        let reservas = [];


        const hoy =
            new Date();

        hoy.setHours(
            0,
            0,
            0,
            0
        );


        /* =====================================================
           MESES
        ===================================================== */

        const nombresMeses = [
            "enero",
            "febrero",
            "marzo",
            "abril",
            "mayo",
            "junio",
            "julio",
            "agosto",
            "septiembre",
            "octubre",
            "noviembre",
            "diciembre"
        ];


        /* =====================================================
           INICIO
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            iniciar
        );


        async function iniciar() {

            actualizarCalendario();

            actualizarBotonesHora();

            await cargarReservas();

        }


        /* =====================================================
           CARGAR RESERVAS
        ===================================================== */

        async function cargarReservas() {

            try {

                const respuesta =
                    await fetch(
                        URL_GOOGLE_SHEETS +
                        "?accion=obtener"
                    );


                if (!respuesta.ok) {

                    throw new Error(
                        "No se pudo conectar"
                    );

                }


                const texto =
                    await respuesta.text();


                console.log(
                    "Respuesta Google Sheets:",
                    texto
                );


                let datos;


                try {

                    datos =
                        JSON.parse(
                            texto
                        );

                } catch (error) {

                    console.error(
                        "Respuesta no JSON:",
                        texto
                    );

                    datos = [];

                }


                reservas =
                    procesarReservas(
                        datos
                    );


            } catch (error) {

                console.error(
                    "Error cargando reservas:",
                    error
                );

                reservas = [];

            }


            actualizarCalendario();

            actualizarBotonesHora();

        }


        /* =====================================================
           PROCESAR RESERVAS
        ===================================================== */

        function procesarReservas(
            datos
        ) {

            if (!datos) {

                return [];

            }


            let filas = [];


            if (
                !Array.isArray(datos) &&
                Array.isArray(datos.data)
            ) {

                filas =
                    datos.data;

            }

            else if (
                Array.isArray(datos)
            ) {

                filas =
                    datos;

            }

            else {

                return [];

            }


            const resultado = [];


            filas.forEach(
                function (fila) {

                    if (!fila) {

                        return;

                    }


                    let fecha = "";

                    let hora = "";


                    /*
                     * OBJETO
                     */

                    if (
                        typeof fila === "object" &&
                        !Array.isArray(fila)
                    ) {

                        fecha =
                            fila.fecha ??
                            fila.Fecha ??
                            fila.date ??
                            fila.Date ??
                            "";


                        hora =
                            fila.hora ??
                            fila.Hora ??
                            fila.time ??
                            fila.Time ??
                            "";

                    }


                    /*
                     * ARRAY
                     */

                    else if (
                        Array.isArray(fila)
                    ) {

                        fecha =
                            fila[0] ??
                            "";

                        hora =
                            fila[1] ??
                            "";

                    }


                    const fechaNormalizada =
                        normalizarFecha(
                            fecha
                        );


                    const horaNormalizada =
                        normalizarHora(
                            hora
                        );


                    if (
                        fechaNormalizada &&
                        horaNormalizada
                    ) {

                        resultado.push({

                            fecha:
                                fechaNormalizada,

                            hora:
                                horaNormalizada

                        });

                    }

                }
            );


            return resultado;

        }


        /* =====================================================
           NORMALIZAR FECHA
        ===================================================== */

        function normalizarFecha(
            valor
        ) {

            if (
                valor === null ||
                valor === undefined
            ) {

                return "";

            }


            const texto =
                String(valor).trim();


            /*
             * YYYY-MM-DD
             */

            let coincidencia =
                texto.match(
                    /^(\d{4})-(\d{1,2})-(\d{1,2})/
                );


            if (coincidencia) {

                return (
                    coincidencia[1] +
                    "-" +
                    String(
                        coincidencia[2]
                    ).padStart(
                        2,
                        "0"
                    ) +
                    "-" +
                    String(
                        coincidencia[3]
                    ).padStart(
                        2,
                        "0"
                    )
                );

            }


            /*
             * DD/MM/YYYY
             */

            coincidencia =
                texto.match(
                    /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
                );


            if (coincidencia) {

                const dia =
                    parseInt(
                        coincidencia[1],
                        10
                    );


                const mes =
                    parseInt(
                        coincidencia[2],
                        10
                    );


                const año =
                    coincidencia[3];


                return (
                    año +
                    "-" +
                    String(
                        mes
                    ).padStart(
                        2,
                        "0"
                    ) +
                    "-" +
                    String(
                        dia
                    ).padStart(
                        2,
                        "0"
                    )
                );

            }


            /*
             * Último intento
             */

            const fecha =
                new Date(
                    texto
                );


            if (
                !isNaN(
                    fecha.getTime()
                )
            ) {

                return convertirFechaISO(
                    fecha
                );

            }


            return "";

        }


        /* =====================================================
           NORMALIZAR HORA
        ===================================================== */

        function normalizarHora(
            valor
        ) {

            if (
                valor === null ||
                valor === undefined
            ) {

                return "";

            }


            const texto =
                String(valor)
                    .trim()
                    .toUpperCase();


            /*
             * 10:00
             * 10:00:00
             */

            let coincidencia =
                texto.match(
                    /^(\d{1,2}):(\d{2})(?::\d{2})?$/
                );


            if (coincidencia) {

                return (
                    String(
                        parseInt(
                            coincidencia[1],
                            10
                        )
                    ).padStart(
                        2,
                        "0"
                    ) +
                    ":" +
                    coincidencia[2]
                );

            }


            /*
             * 10 AM
             * 10:00 AM
             * 2 PM
             * 2:00 PM
             */

            coincidencia =
                texto.match(
                    /^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/
                );


            if (coincidencia) {

                let horas =
                    parseInt(
                        coincidencia[1],
                        10
                    );


                const minutos =
                    coincidencia[2] ||
                    "00";


                const periodo =
                    coincidencia[3];


                if (
                    periodo === "PM" &&
                    horas !== 12
                ) {

                    horas += 12;

                }


                if (
                    periodo === "AM" &&
                    horas === 12
                ) {

                    horas = 0;

                }


                return (
                    String(
                        horas
                    ).padStart(
                        2,
                        "0"
                    ) +
                    ":" +
                    minutos
                );

            }


            return "";

        }


        /* =====================================================
           FECHA ISO
        ===================================================== */

        function convertirFechaISO(
            fecha
        ) {

            return (
                fecha.getFullYear() +
                "-" +
                String(
                    fecha.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                ) +
                "-" +
                String(
                    fecha.getDate()
                ).padStart(
                    2,
                    "0"
                )
            );

        }


        /* =====================================================
           ACTUALIZAR CALENDARIO
        ===================================================== */

        function actualizarCalendario() {

            const calendario =
                document.getElementById(
                    "calendario"
                );


            const titulo =
                document.getElementById(
                    "mesActual"
                );


            calendario.innerHTML =
                "";


            const año =
                fechaCalendario.getFullYear();


            const mes =
                fechaCalendario.getMonth();


            titulo.textContent =
                nombresMeses[mes] +
                " " +
                año;


            /*
             * Primer día
             */

            const primerDia =
                new Date(
                    año,
                    mes,
                    1
                );


            const diaSemana =
                primerDia.getDay();


            /*
             * Lunes = 0
             * Martes = 1
             * Miércoles = 2
             * Jueves = 3
             * Viernes = 4
             *
             * Si el mes comienza sábado
             * o domingo, empezamos directamente
             * desde lunes.
             */

            let espaciosIniciales =
                0;


            if (
                diaSemana >= 1 &&
                diaSemana <= 5
            ) {

                espaciosIniciales =
                    diaSemana - 1;

            }


            /*
             * Espacios iniciales
             */

            for (
                let i = 0;
                i < espaciosIniciales;
                i++
            ) {

                const espacio =
                    document.createElement(
                        "div"
                    );


                espacio.className =
                    "dia vacio";


                calendario.appendChild(
                    espacio
                );

            }


            /*
             * Días del mes
             */

            const cantidadDias =
                new Date(
                    año,
                    mes + 1,
                    0
                ).getDate();


            for (
                let numero = 1;
                numero <= cantidadDias;
                numero++
            ) {

                const fecha =
                    new Date(
                        año,
                        mes,
                        numero
                    );


                const diaSemanaActual =
                    fecha.getDay();


                /*
                 * NO mostrar sábado
                 * ni domingo.
                 */

                if (
                    diaSemanaActual === 0 ||
                    diaSemanaActual === 6
                ) {

                    continue;

                }


                const fechaISO =
                    convertirFechaISO(
                        fecha
                    );


                const disponibilidad =
                    obtenerDisponibilidad(
                        fechaISO
                    );


                const boton =
                    document.createElement(
                        "button"
                    );


                boton.type =
                    "button";


                boton.className =
                    "dia";


                /*
                 * Número
                 */

                const numeroElemento =
                    document.createElement(
                        "div"
                    );


                numeroElemento.className =
                    "numero-dia";


                numeroElemento.textContent =
                    numero;


                boton.appendChild(
                    numeroElemento
                );


                /*
                 * Estado
                 */

                const estado =
                    document.createElement(
                        "div"
                    );


                estado.className =
                    "estado-dia";


                /*
                 * Comprobar pasado
                 */

                const esPasado =
                    fecha < hoy;


                if (esPasado) {

                    boton.classList.add(
                        "pasado"
                    );

                    estado.textContent =
                        "No disponible";

                    boton.disabled =
                        true;

                }


                /*
                 * 2 disponibles
                 */

                else if (
                    disponibilidad.disponibles === 2
                ) {

                    boton.classList.add(
                        "disponible"
                    );

                    estado.textContent =
                        "Disponible";

                }


                /*
                 * 1 disponible
                 */

                else if (
                    disponibilidad.disponibles === 1
                ) {

                    boton.classList.add(
                        "parcial"
                    );

                    estado.textContent =
                        "1 disponible";

                }


                /*
                 * 0 disponibles
                 */

                else {

                    boton.classList.add(
                        "completo"
                    );

                    estado.textContent =
                        "Completo";

                    boton.disabled =
                        true;

                }


                boton.appendChild(
                    estado
                );


                /*
                 * Seleccionado
                 */

                if (
                    fechaSeleccionada ===
                    fechaISO
                ) {

                    boton.classList.add(
                        "seleccionado"
                    );

                }


                /*
                 * Click
                 */

                if (
                    !boton.disabled
                ) {

                    boton.addEventListener(
                        "click",
                        function () {

                            seleccionarFecha(
                                fechaISO
                            );

                        }
                    );

                }


                calendario.appendChild(
                    boton
                );

            }


            actualizarBotonMesAnterior();

        }


        /* =====================================================
           BOTÓN MES ANTERIOR
        ===================================================== */

        function actualizarBotonMesAnterior() {

            const boton =
                document.getElementById(
                    "mesAnterior"
                );


            const mesActual =
                new Date(
                    hoy.getFullYear(),
                    hoy.getMonth(),
                    1
                );


            const mesMostrado =
                new Date(
                    fechaCalendario.getFullYear(),
                    fechaCalendario.getMonth(),
                    1
                );


            boton.disabled =
                mesMostrado <= mesActual;

        }


        /* =====================================================
           CAMBIAR MES
        ===================================================== */

        function cambiarMes(
            direccion
        ) {

            let nuevoMes =
                new Date(
                    fechaCalendario.getFullYear(),
                    fechaCalendario.getMonth() +
                    direccion,
                    1
                );


            const mesActual =
                new Date(
                    hoy.getFullYear(),
                    hoy.getMonth(),
                    1
                );


            if (
                nuevoMes < mesActual
            ) {

                nuevoMes =
                    mesActual;

            }


            fechaCalendario =
                nuevoMes;


            /*
             * Quitar selección
             */

            fechaSeleccionada =
                null;


            horaSeleccionada =
                null;


            document.getElementById(
                "fechaSeleccionada"
            ).textContent =
                "Selecciona un día en el calendario";


            actualizarCalendario();

            actualizarBotonesHora();

            limpiarMensaje();

        }


        /* =====================================================
           DISPONIBILIDAD
        ===================================================== */

        function obtenerDisponibilidad(
            fechaISO
        ) {

            const ocupadas =
                obtenerHorasOcupadas(
                    fechaISO
                );


            const disponibles =
                HORAS.filter(
                    function (hora) {

                        return !ocupadas.includes(
                            hora
                        );

                    }
                );


            return {

                ocupadas:
                    ocupadas,

                disponibles:
                    disponibles.length

            };

        }


        /* =====================================================
           HORAS OCUPADAS
        ===================================================== */

        function obtenerHorasOcupadas(
            fechaISO
        ) {

            return reservas
                .filter(
                    function (reserva) {

                        return (
                            reserva.fecha ===
                            fechaISO
                        );

                    }
                )
                .map(
                    function (reserva) {

                        return normalizarHora(
                            reserva.hora
                        );

                    }
                );

        }


        /* =====================================================
           SELECCIONAR FECHA
        ===================================================== */

        function seleccionarFecha(
            fechaISO
        ) {

            const fecha =
                crearFechaDesdeISO(
                    fechaISO
                );


            /*
             * No permitir pasado.
             */

            if (
                fecha < hoy
            ) {

                return;

            }


            /*
             * No permitir completo.
             */

            const disponibilidad =
                obtenerDisponibilidad(
                    fechaISO
                );


            if (
                disponibilidad.disponibles === 0
            ) {

                mostrarMensaje(
                    "Ese día está completamente reservado.",
                    "error"
                );

                return;

            }


            fechaSeleccionada =
                fechaISO;


            horaSeleccionada =
                null;


            /*
             * Mostrar fecha
             */

            const fechaTexto =
                fecha.toLocaleDateString(
                    "es-ES",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );


            document.getElementById(
                "fechaSeleccionada"
            ).textContent =
                "Fecha seleccionada: " +
                capitalizar(
                    fechaTexto
                );


            actualizarCalendario();

            actualizarBotonesHora();

            limpiarMensaje();

        }


        /* =====================================================
           CREAR FECHA
        ===================================================== */

        function crearFechaDesdeISO(
            fechaISO
        ) {

            const partes =
                fechaISO.split("-");


            return new Date(
                parseInt(
                    partes[0],
                    10
                ),
                parseInt(
                    partes[1],
                    10
                ) - 1,
                parseInt(
                    partes[2],
                    10
                )
            );

        }


        /* =====================================================
           CAPITALIZAR
        ===================================================== */

        function capitalizar(
            texto
        ) {

            if (!texto) {

                return "";

            }


            return (
                texto.charAt(0).toUpperCase() +
                texto.slice(1)
            );

        }


        /* =====================================================
           SELECCIONAR HORA
        ===================================================== */

        function seleccionarHora(
            hora
        ) {

            if (
                !fechaSeleccionada
            ) {

                mostrarMensaje(
                    "Primero selecciona un día.",
                    "error"
                );

                return;

            }


            const ocupadas =
                obtenerHorasOcupadas(
                    fechaSeleccionada
                );


            if (
                ocupadas.includes(
                    hora
                )
            ) {

                mostrarMensaje(
                    "Ese horario ya está reservado.",
                    "error"
                );

                actualizarBotonesHora();

                return;

            }


            horaSeleccionada =
                hora;


            actualizarBotonesHora();

            limpiarMensaje();

        }


        /* =====================================================
           ACTUALIZAR BOTONES HORARIOS
        ===================================================== */

        function actualizarBotonesHora() {

            const boton10 =
                document.getElementById(
                    "hora10"
                );


            const boton14 =
                document.getElementById(
                    "hora14"
                );


            /*
             * Reiniciar
             */

            boton10.classList.remove(
                "seleccionado",
                "ocupado"
            );


            boton14.classList.remove(
                "seleccionado",
                "ocupado"
            );


            boton10.disabled =
                true;


            boton14.disabled =
                true;


            /*
             * Sin fecha
             */

            if (
                !fechaSeleccionada
            ) {

                return;

            }


            const ocupadas =
                obtenerHorasOcupadas(
                    fechaSeleccionada
                );


            /*
             * 10:00 AM
             */

            if (
                ocupadas.includes(
                    "10:00"
                )
            ) {

                boton10.classList.add(
                    "ocupado"
                );

                boton10.disabled =
                    true;

            }

            else {

                boton10.disabled =
                    false;


                if (
                    horaSeleccionada ===
                    "10:00"
                ) {

                    boton10.classList.add(
                        "seleccionado"
                    );

                }

            }


            /*
             * 2:00 PM
             */

            if (
                ocupadas.includes(
                    "14:00"
                )
            ) {

                boton14.classList.add(
                    "ocupado"
                );

                boton14.disabled =
                    true;

            }

            else {

                boton14.disabled =
                    false;


                if (
                    horaSeleccionada ===
                    "14:00"
                ) {

                    boton14.classList.add(
                        "seleccionado"
                    );

                }

            }

        }


        /* =====================================================
           RESERVAR
        ===================================================== */

        async function reservar(
            evento
        ) {

            evento.preventDefault();


            /*
             * Comprobar fecha
             */

            if (
                !fechaSeleccionada
            ) {

                mostrarMensaje(
                    "Selecciona primero un día.",
                    "error"
                );

                return;

            }


            /*
             * Comprobar hora
             */

            if (
                !horaSeleccionada
            ) {

                mostrarMensaje(
                    "Selecciona primero un horario.",
                    "error"
                );

                return;

            }


            /*
             * Datos
             */

            const nombre =
                document
                    .getElementById(
                        "nombre"
                    )
                    .value
                    .trim();


            const telefono =
                document
                    .getElementById(
                        "telefono"
                    )
                    .value
                    .trim();


            if (!nombre) {

                mostrarMensaje(
                    "Escribe tu nombre.",
                    "error"
                );

                return;

            }


            if (!telefono) {

                mostrarMensaje(
                    "Escribe tu teléfono.",
                    "error"
                );

                return;

            }


            /*
             * Comprobar nuevamente
             * disponibilidad.
             */

            const ocupadas =
                obtenerHorasOcupadas(
                    fechaSeleccionada
                );


            if (
                ocupadas.includes(
                    horaSeleccionada
                )
            ) {

                mostrarMensaje(
                    "Ese horario ya fue reservado. Selecciona otro.",
                    "error"
                );

                await cargarReservas();

                return;

            }


            /*
             * Botón
             */

            const boton =
                document.getElementById(
                    "botonReservar"
                );


            boton.disabled =
                true;


            boton.textContent =
                "Guardando reserva...";


            try {

                /*
                 * Crear datos
                 */

                const datos =
                    new URLSearchParams();


                datos.append(
                    "accion",
                    "reservar"
                );


                datos.append(
                    "fecha",
                    fechaSeleccionada
                );


                datos.append(
                    "hora",
                    horaSeleccionada
                );


                datos.append(
                    "nombre",
                    nombre
                );


                datos.append(
                    "telefono",
                    telefono
                );


                /*
                 * Enviar a Google Sheets
                 */

                const respuesta =
                    await fetch(
                        URL_GOOGLE_SHEETS,
                        {
                            method: "POST",

                            body: datos
                        }
                    );


                const texto =
                    await respuesta.text();


                console.log(
                    "Respuesta de Google Sheets:",
                    texto
                );


                /*
                 * Intentar JSON
                 */

                let resultado =
                    null;


                try {

                    resultado =
                        JSON.parse(
                            texto
                        );

                } catch (error) {

                    resultado =
                        null;

                }


                /*
                 * Error explícito
                 */

                if (
                    resultado &&
                    resultado.ok === false
                ) {

                    throw new Error(
                        resultado.mensaje ||
                        "No se pudo guardar la reserva."
                    );

                }


                /*
                 * Guardar localmente
                 */

                reservas.push({

                    fecha:
                        fechaSeleccionada,

                    hora:
                        horaSeleccionada

                });


                /*
                 * Guardar valores
                 */

                const fechaReserva =
                    fechaSeleccionada;


                const horaReserva =
                    horaSeleccionada;


                /*
                 * Actualizar
                 */

                actualizarCalendario();

                actualizarBotonesHora();


                /*
                 * Mensaje
                 */

                mostrarMensaje(
                    "¡Reserva realizada correctamente!",
                    "exito"
                );


                /*
                 * Fecha para WhatsApp
                 */

                const fecha =
                    crearFechaDesdeISO(
                        fechaReserva
                    );


                const fechaTexto =
                    fecha.toLocaleDateString(
                        "es-ES",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    );


                let horaTexto =
                    "";


                if (
                    horaReserva ===
                    "10:00"
                ) {

                    horaTexto =
                        "10:00 AM";

                }

                else if (
                    horaReserva ===
                    "14:00"
                ) {

                    horaTexto =
                        "2:00 PM";

                }


                /*
                 * WhatsApp
                 */

                const textoWhatsApp =
                    "Hola, quiero confirmar mi cita." +
                    "\n\n" +
                    "💅 Uñas y Belleza" +
                    "\n" +
                    "👤 Nombre: " +
                    nombre +
                    "\n" +
                    "📅 Fecha: " +
                    fechaTexto +
                    "\n" +
                    "🕐 Hora: " +
                    horaTexto +
                    "\n" +
                    "📱 Teléfono: " +
                    telefono;


                const urlWhatsApp =
                    "https://wa.me/" +
                    NUMERO_WHATSAPP +
                    "?text=" +
                    encodeURIComponent(
                        textoWhatsApp
                    );


                /*
                 * Abrir WhatsApp
                 */

                window.open(
                    urlWhatsApp,
                    "_blank"
                );


                /*
                 * Limpiar formulario
                 */

                document
                    .getElementById(
                        "formularioReserva"
                    )
                    .reset();


                horaSeleccionada =
                    null;


                actualizarBotonesHora();


            } catch (error) {

                console.error(
                    "Error realizando reserva:",
                    error
                );


                mostrarMensaje(
                    "No se pudo guardar la reserva. Revisa la conexión con Google Sheets.",
                    "error"
                );

            }


            /*
             * Reactivar botón
             */

            boton.disabled =
                false;


            boton.textContent =
                "Confirmar reserva";

        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        function mostrarMensaje(
            texto,
            tipo
        ) {

            const elemento =
                document.getElementById(
                    "mensaje"
                );


            elemento.textContent =
                texto;


            elemento.className =
                "mensaje " +
                tipo;


            clearTimeout(
                window.temporizadorMensaje
            );


            window.temporizadorMensaje =
                setTimeout(
                    function () {

                        limpiarMensaje();

                    },
                    5000
                );

        }


        function limpiarMensaje() {

            const elemento =
                document.getElementById(
                    "mensaje"
                );


            elemento.textContent =
                "";


            elemento.className =
                "mensaje";

        }

    </script>
